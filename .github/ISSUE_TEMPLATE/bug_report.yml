name: Bug Report
description: Report unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Minimal steps or code sample.
      render: python
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: UATP version or commit hash
      placeholder: "e.g., 1.1.0"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, and any relevant context.
      placeholder: "Python 3.11, macOS 14, SQLite backend"

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant error output or stack traces.
      render: shell
